<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b2257">
<title>Литвин Кликер</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--bg:#e8f1ff;--bg2:#cfe2ff;--card:#fff;--ink:#0a1f44;--mute:#4a6490;--acc:#1f6bff;--acc2:#00b4ff;--line:#b9d1fb;--gold:#e69500;--goldbg:#fff4d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050f26;--bg2:#0b2257;--card:#0c1c42;--ink:#eaf2ff;--mute:#8fb0e8;--acc:#3d86ff;--acc2:#27c5ff;--line:#1c3a7a;--gold:#ffc94d;--goldbg:#2a2410}}
:root[data-theme="dark"]{--bg:#050f26;--bg2:#0b2257;--card:#0c1c42;--ink:#eaf2ff;--mute:#8fb0e8;--acc:#3d86ff;--acc2:#27c5ff;--line:#1c3a7a;--gold:#ffc94d;--goldbg:#2a2410}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);font-family:Manrope,system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.blob{position:fixed;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc2) 35%,transparent),transparent 65%);filter:blur(30px);pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.b1{left:-30vmax;top:-20vmax}.b2{right:-35vmax;bottom:-25vmax;animation-delay:-9s;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 40%,transparent),transparent 65%)}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.1)}}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
header{text-align:center;padding:12px 16px 0}
.top{display:flex;justify-content:center;align-items:center;gap:8px}
h1{font-family:Unbounded,sans-serif;font-weight:800;font-size:15px;margin:0;letter-spacing:-.01em}
#mult{display:none;font-weight:800;font-size:12px;color:var(--gold);background:var(--goldbg);border:1px solid var(--gold);border-radius:99px;padding:3px 9px}
#mult.on{display:inline-block}
.score{font-family:Unbounded,sans-serif;font-weight:800;font-size:clamp(40px,13vw,66px);line-height:1.08;margin:6px 0 0;background:linear-gradient(180deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;transition:transform .08s}
.score.b{transform:scale(1.05)}
.sub{display:flex;justify-content:center;gap:8px;margin:6px 0 0}
.chip{background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:700;font-size:13px;color:var(--mute)}
.chip b{color:var(--ink)}
.stage{position:relative;flex:1;min-height:0;container-type:size;display:grid;place-items:center}
.orb{position:relative;width:min(80cqw,80cqh,380px);aspect-ratio:1}
.orb::before{content:"";position:absolute;inset:-9px;border-radius:calc(11% + 9px);background:conic-gradient(from var(--a),var(--acc2),var(--acc),#7fd6ff,var(--acc2));animation:spin 5s linear infinite;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--acc) 70%,transparent))}
@keyframes spin{to{--a:360deg}}
#hit{all:unset;cursor:pointer;position:absolute;inset:0;border-radius:11%;overflow:hidden;border:4px solid var(--bg);transition:transform .07s}
#hit.p{transform:scale(.93)}
#hit:focus-visible{outline:4px solid var(--acc2);outline-offset:10px}
#hit img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.fl{position:absolute;font-family:Unbounded,sans-serif;font-weight:800;color:#fff;font-size:24px;pointer-events:none;animation:up .8s ease-out forwards;text-shadow:0 0 10px var(--acc),0 2px 6px rgba(0,20,80,.6);z-index:5}
@keyframes up{to{transform:translateY(-100px);opacity:0}}
.pt{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--acc2);pointer-events:none;z-index:4;animation:pt .55s ease-out forwards}
@keyframes pt{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.sheet{position:relative;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:0 -12px 34px rgba(10,40,120,.22);display:flex;flex-direction:column;height:calc(72px + env(safe-area-inset-bottom,0px));transition:height .28s cubic-bezier(.3,.9,.3,1);overflow:hidden}
.sheet.open{height:min(60dvh,470px)}
.grip{flex:none;height:18px;display:grid;place-items:center;cursor:pointer}
.grip i{width:40px;height:4px;border-radius:2px;background:var(--line)}
.tabs{flex:none;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:0 14px 10px;padding:4px;background:color-mix(in srgb,var(--acc) 9%,var(--card));border-radius:16px}
.tab{all:unset;cursor:pointer;text-align:center;padding:11px 6px;border-radius:12px;font-family:Unbounded,sans-serif;font-weight:600;font-size:12px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px}
.tab.on{background:var(--acc);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 50%,transparent)}
.tab:focus-visible{outline:3px solid var(--acc2)}
#badge{background:var(--gold);color:#241a00;border-radius:99px;padding:1px 8px;font-size:12px}
#badge[data-n="0"]{display:none}
.pane{flex:1;overflow-y:auto;padding:0 14px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;align-content:start;overscroll-behavior:contain}
.pane[hidden]{display:none}
.up{all:unset;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;align-items:center;padding:12px;min-height:66px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--acc) 6%,var(--card))}
.up.ok{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.up:active:not(:disabled){transform:scale(.98)}
.up:focus-visible{outline:3px solid var(--acc2)}
.up:disabled{opacity:.5}
.up.legend{border-color:var(--gold);background:var(--goldbg)}.up.legend .ic{background:linear-gradient(145deg,#ffd76a,var(--gold));color:#241a00}.up.legend .c{color:var(--gold)}.up.legend.ok{box-shadow:0 0 0 1px var(--gold) inset}
.ic{grid-row:1/3;width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--acc2),var(--acc));display:grid;place-items:center;color:#fff;font-family:Unbounded,sans-serif;font-weight:800;font-size:15px}
.up b{font-size:15px}.up span{color:var(--mute);font-size:12.5px;font-weight:500;grid-column:2}
.up .c{grid-row:1/3;grid-column:3;font-family:Unbounded,sans-serif;font-weight:600;color:var(--acc);font-size:14px}
.rb{border:1px solid var(--gold);background:var(--goldbg);border-radius:20px;padding:16px;display:grid;gap:10px}
.rb h3{font-family:Unbounded,sans-serif;font-size:16px;margin:0;color:var(--gold)}
.rb p{margin:0;font-size:13.5px;color:var(--mute);line-height:1.45}
.bar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--gold) 20%,transparent);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#fff1b0);border-radius:99px;transition:width .2s}
.big{all:unset;cursor:pointer;text-align:center;padding:15px;border-radius:16px;background:var(--gold);color:#241a00;font-family:Unbounded,sans-serif;font-weight:800;font-size:15px}
.big:disabled{opacity:.4}
.big.arm{background:#ff5a4d;color:#fff}
.big:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.st small{display:block;color:var(--mute);font-size:11.5px;font-weight:700}.st b{font-size:15px}
#reset{all:unset;cursor:pointer;text-align:center;color:var(--mute);font-size:12.5px;padding:8px}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-140%);background:var(--gold);color:#241a00;font-weight:800;font-size:14px;padding:10px 16px;border-radius:14px;z-index:20;transition:transform .3s;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
.cnt{opacity:.75;font-size:10px}
.ach{display:grid;grid-template-columns:40px 1fr;gap:2px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:16px;opacity:.5}
.ach.done{opacity:1;border-color:var(--gold);background:var(--goldbg)}
.ach .ic{width:40px;height:40px;grid-row:1/3;font-size:13px;filter:grayscale(1)}
.ach.done .ic{filter:none;background:linear-gradient(145deg,#ffd76a,var(--gold));color:#241a00}
.ach b{font-size:14px}.ach span{color:var(--mute);font-size:12.5px}
#snd{all:unset;cursor:pointer;position:absolute;right:12px;top:12px;z-index:6;font-weight:800;font-size:12px;color:var(--mute);background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line);border-radius:99px;padding:6px 11px}
#snd:focus-visible{outline:3px solid var(--acc2)}
.gold{position:absolute;width:76px;height:76px;border-radius:50%;border:4px solid var(--gold);overflow:hidden;cursor:pointer;z-index:8;padding:0;background:var(--card);box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 30%,transparent),0 0 30px var(--gold);animation:pop .4s cubic-bezier(.3,1.6,.5,1),pulse 1s ease-in-out .4s infinite alternate}
.gold img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
@keyframes pop{from{transform:scale(0)}}@keyframes pulse{to{transform:scale(1.12)}}
body.fr .orb::before{background:conic-gradient(from var(--a),#ffd76a,#ff9d00,#fff1b0,#ffd76a)}
@media(prefers-reduced-motion:reduce){.gold{animation:none}}
@media(prefers-reduced-motion:reduce){.fl,.pt,.blob,.orb::before{animation:none}#hit,.sheet,#toast{transition:none}}
</style></head><body>

<div id="app">
<div id="toast" role="status"></div><button id="snd" aria-label="Звук"></button>

<p id="rbtxt"></p>
<button class="big" id="rbgo">Переродиться</button></div>
<div class="stats">
<div class="st"><small>Звёзды</small><b id="s1">0</b></div>
<div class="st"><small>Перерождений</small><b id="s2">0</b></div>
<div class="st"><small>Всего заработано</small><b id="s3">0</b></div>
<div class="st"><small>Всего кликов</small><b id="s4">0</b></div></div>
<button id="reset">Сбросить всё</button></div>
<div class="pane" id="achp" hidden><div id="achl" style="display:grid;gap:8px"></div></div>
</section>
</div>
<script>
const U=[
{id:'power',n:'Сильный клик',d:'+1 за клик',base:15,type:'click',v:1,i:'+1'},
{id:'bro',n:'Друг помогает',d:'+1 в секунду',base:60,type:'auto',v:1,i:'Д'},
{id:'gym',n:'Качалка',d:'+5 в секунду',base:400,type:'auto',v:5,i:'К'},
{id:'bmw',n:'Выезд на машине',d:'+30 в секунду',base:3000,type:'auto',v:30,i:'М'},
{id:'mega',n:'Мегаклик',d:'+25 за клик',base:8000,type:'click',v:25,i:'×'},
{id:'protein',n:'Протеин',d:'+3 за клик',base:200,type:'click',v:3,i:'П'},
{id:'shoes',n:'Новые кроссовки',d:'+8 за клик',base:1200,type:'click',v:8,i:'Кр'},
{id:'stream',n:'Стрим',d:'+15 в секунду',base:2000,type:'auto',v:15,i:'С'},
{id:'team',n:'Своя команда',d:'+100 в секунду',base:15000,type:'auto',v:100,i:'Т'},
{id:'studio',n:'Студия',d:'+300 в секунду',base:40000,type:'auto',v:300,i:'Ст'},
{id:'burger',n:'Скормить бургер Тимуру',d:'×2 ко всему доходу',base:100000,type:'once',once:true,v:2,i:'Б',toast:'Тимур доволен. Доход ×2'}
];
U.sort((a,b)=>a.base-b.base);
const K2='litvin-clicker-v2',K1='litvin-clicker-v1',UNIT=5000,BONUS=0.2;
let S={score:0,own:{},run:0,total:0,clicks:0,stars:0,rebirths:0};
try{const r=localStorage.getItem(K2)||localStorage.getItem(K1);if(r){S=Object.assign(S,JSON.parse(r));S.run=Math.max(S.run,S.score)}}catch(e){}
const $=id=>document.getElementById(id);
const mult=()=>(1+BONUS*S.stars)*(S.own.burger?2:1);
const cost=u=>u.once?u.base:Math.ceil(u.base*Math.pow(1.17,S.own[u.id]||0));
let fr=0;const cpc=()=>(Date.now()<fr?7:1)*mult()*(1+U.filter(u=>u.type==='click').reduce((a,u)=>a+u.v*(S.own[u.id]||0),0));
const cps=()=>mult()*U.filter(u=>u.type==='auto').reduce((a,u)=>a+u.v*(S.own[u.id]||0),0);
const sg=()=>Math.floor(Math.sqrt(S.run/UNIT));
function fmt(n){n=Math.floor(n);if(n<1e6)return n.toLocaleString('ru-RU');
const t=[[1e12,'трлн'],[1e9,'млрд'],[1e6,'млн']];for(const[v,s]of t)if(n>=v)return (n/v).toFixed(n/v<10?2:1).replace('.',',')+' '+s;return n}
let AC=null,muted=false;try{muted=localStorage.getItem('lc-mute')==='1'}catch(e){}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f1,f2,d,ty,v){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function clank(){const r=1+Math.random()*.3;tone(950*r,300*r,.09,'square',.06);tone(2000*r,1300*r,.05,'triangle',.04);tone(160,50,.1,'sine',.14)}
function rev(){tone(70,280,.9,'sawtooth',.08);tone(140,560,.9,'square',.025)}
function fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,f,.2,'triangle',.08),i*90))}
function coin(){tone(988,988,.07,'square',.045);setTimeout(()=>tone(1319,1319,.2,'square',.045),70)}
document.addEventListener('pointerup',()=>ac());
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function save(){try{localStorage.setItem(K2,JSON.stringify(S))}catch(e){}}
function gain(g){S.score+=g;S.run+=g;S.total+=g}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
const shop=$('shop');
U.forEach(u=>{const b=document.createElement('button');b.className='up'+(u.once?' legend':'');b.id='u-'+u.id;
b.innerHTML='<div class="ic"></div><b></b><div class="c"></div><span></span>';b.children[0].textContent=u.i;b.onclick=()=>buy(u);shop.appendChild(b)});
function render(){
$('score').textContent=fmt(S.score);$('cps').textContent=fmt(cps());$('cpc').textContent=fmt(cpc());
const m=$('mult');m.className=mult()>1?'on':'';m.textContent='★ ×'+mult().toFixed(1).replace('.',',');
let n=0;
U.forEach(u=>{const b=$('u-'+u.id),c=cost(u);b.children[1].textContent=u.once?u.n:u.n+' ×'+(S.own[u.id]||0);b.children[3].textContent=u.d;
b.children[2].textContent=(u.once&&S.own[u.id])?'Куплено':fmt(c);b.disabled=S.score<c||!!(u.once&&S.own[u.id]);b.classList.toggle('ok',!b.disabled);if(!b.disabled)n++});
$('badge').textContent=n||'';$('badge').dataset.n=n;
const g=sg(),lo=g*g*UNIT,hi=(g+1)*(g+1)*UNIT;
$('rbbar').style.width=Math.min(100,(S.run-lo)/(hi-lo)*100)+'%';
$('rbtxt').textContent=g>0?'Сейчас получишь ★ '+g+' · следующая звезда при '+fmt(hi)+' за забег':'Первая звезда при '+fmt(UNIT)+' за забег · сейчас '+fmt(S.run);
if(!armed){$('rbgo').disabled=g<1;$('rbgo').textContent=g>0?'Переродиться за ★ '+g:'Пока рано'}
$('s1').textContent=S.stars;$('s2').textContent=S.rebirths;$('s3').textContent=fmt(S.total);$('s4').textContent=fmt(S.clicks);checkAch()}
function buy(u){const c=cost(u);if(S.score<c||(u.once&&S.own[u.id]))return;S.score-=c;S.own[u.id]=(S.own[u.id]||0)+1;buzz(15);if(u.id==='bmw')rev();else coin();save();render();if(u.toast)toast(u.toast)}
let armed=null;
function arm(btn,label,fn){if(armed&&armed.btn===btn){clearTimeout(armed.t);const o=armed.o;armed=null;btn.classList.remove('arm');btn.textContent=o;fn();return}
const o=btn.textContent;armed={btn,o,t:setTimeout(()=>{armed=null;btn.classList.remove('arm');btn.textContent=o;render()},3000)};btn.classList.add('arm');btn.textContent='Точно? Тапни ещё раз'}
$('rbgo').onclick=function(){if(sg()<1)return;arm(this,'',()=>{const g=sg();S.stars+=g;S.rebirths++;S.score=0;S.run=0;S.own={};save();render();toast('★ +'+g+' · теперь ×'+mult().toFixed(1).replace('.',','));buzz([20,40,20]);rev()})};
$('reset').onclick=function(){arm(this,'',()=>{S={score:0,own:{},run:0,total:0,clicks:0,stars:0,rebirths:0};save();render();toast('Прогресс сброшен')})};
const A=[
{id:'first',n:'Первый клик',d:'Кликни по Литвину',i:'1',ok:()=>S.clicks>=1},
{id:'c100',n:'Разминка',d:'100 кликов',i:'100',ok:()=>S.clicks>=100},
{id:'c1k',n:'Качок',d:'1 000 кликов',i:'1К',ok:()=>S.clicks>=1000},
{id:'c10k',n:'Литвин-машина',d:'10 000 кликов',i:'10К',ok:()=>S.clicks>=10000},
{id:'s1k',n:'Первая тысяча',d:'Заработай 1 000 за всё время',i:'₽',ok:()=>S.total>=1000},
{id:'s100k',n:'Сто тысяч',d:'Заработай 100 000 за всё время',i:'100К',ok:()=>S.total>=1e5},
{id:'s1m',n:'Миллионер',d:'Заработай 1 000 000 за всё время',i:'1М',ok:()=>S.total>=1e6},
{id:'gym',n:'Зал открыт',d:'Купи Качалку',i:'К',ok:()=>(S.own.gym||0)>=1},
{id:'bmw',n:'Как на фотке',d:'Купи Выезд на машине',i:'М',ok:()=>(S.own.bmw||0)>=1},
{id:'gold',n:'Золотая рыбалка',d:'Поймай золотого Литвина',i:'★',ok:()=>(S.gold||0)>=1},
{id:'burger',n:'Тимур сыт',d:'Скорми бургер Тимуру',i:'Б',ok:()=>!!S.own.burger},
{id:'rb1',n:'Новая жизнь',d:'Переродись впервые',i:'↻',ok:()=>S.rebirths>=1},
{id:'st5',n:'Пять звёзд',d:'Набери 5 звёзд',i:'5★',ok:()=>S.stars>=5}
];
function renderAch(){const L=$('achl');L.textContent='';A.forEach(a=>{const d=document.createElement('div'),done=S.ach.includes(a.id);d.className='ach'+(done?' done':'');
d.innerHTML='<div class="ic"></div><b></b><span></span>';d.children[0].textContent=a.i;d.children[1].textContent=a.n;d.children[2].textContent=a.d;L.appendChild(d)});
$('achc').textContent=S.ach.length+'/'+A.length}
function checkAch(silent){S.ach=S.ach||[];let ch=false;A.forEach(a=>{if(!S.ach.includes(a.id)&&a.ok()){S.ach.push(a.id);ch=true;if(!silent){toast('Достижение: '+a.n);fanfare();buzz([20,40,20])}}});if(ch){renderAch();save()}}
function updSnd(){$('snd').textContent=muted?'Звук выкл':'Звук вкл'}
$('snd').onclick=()=>{muted=!muted;try{localStorage.setItem('lc-mute',muted?'1':'0')}catch(e){}updSnd();if(!muted)clank()};
const hit=$('hit'),st=$('stage'),sc=$('score');
hit.addEventListener('pointerdown',e=>{
const g=cpc();gain(g);S.clicks++;hit.classList.add('p');buzz(6);clank();
const r=st.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
const f=document.createElement('div');f.className='fl';f.textContent='+'+fmt(g);f.style.left=(x-16)+'px';f.style.top=(y-24)+'px';st.appendChild(f);setTimeout(()=>f.remove(),800);
for(let i=0;i<6;i++){const p=document.createElement('div'),a=Math.random()*6.28,d=40+Math.random()*40;p.className='pt';p.style.left=x-4+'px';p.style.top=y-4+'px';p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');st.appendChild(p);setTimeout(()=>p.remove(),560)}
sc.classList.add('b');setTimeout(()=>sc.classList.remove('b'),80);render()});
['pointerup','pointercancel','pointerleave'].forEach(t=>hit.addEventListener(t,()=>hit.classList.remove('p')));
hit.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat){gain(cpc());S.clicks++;render()}}});
hit.addEventListener('contextmenu',e=>e.preventDefault());
const sheet=$('sheet');
function tab(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('shop').hidden=t!=='shop';$('rbp').hidden=t!=='rb';$('achp').hidden=t!=='ach'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{const was=b.classList.contains('on')&&sheet.classList.contains('open');tab(b.dataset.t);sheet.classList.toggle('open',!was)});
$('grip').onclick=()=>sheet.classList.toggle('open');
setInterval(()=>{const a=cps();if(a){gain(a/10);render()}},100);
setInterval(save,3000);
document.addEventListener('visibilitychange',save);
function spawnGold(){
const old=st.querySelector('.gold');if(old)old.remove();
const g=document.createElement('button');g.className='gold';g.setAttribute('aria-label','Золотой Литвин');
const im=document.createElement('img');im.src=document.querySelector('#hit img').src;im.alt='';g.appendChild(im);
const r=st.getBoundingClientRect();
g.style.left=Math.max(6,Math.random()*(r.width-88))+'px';g.style.top=Math.max(6,Math.random()*(r.height-88))+'px';
const t=setTimeout(()=>g.remove(),7000);
g.addEventListener('pointerdown',e=>{e.stopPropagation();clearTimeout(t);g.remove();buzz(25);coin();S.gold=(S.gold||0)+1;
if(Math.random()<.5){const n=Math.max(cpc()*100,cps()*45,200);gain(n);toast('Золотой Литвин: +'+fmt(n))}
else{fr=Date.now()+15000;document.body.classList.add('fr');toast('Режим зверя: клики ×7 на 15 с');setTimeout(()=>{if(Date.now()>=fr)document.body.classList.remove('fr')},15100)}
render()});
st.appendChild(g)}
(function loop(){setTimeout(()=>{spawnGold();loop()},30000+Math.random()*30000)})();
setTimeout(spawnGold,10000);
S.ach=S.ach||[];checkAch(true);updSnd();renderAch();
render();
</script></body></html>
